name: Packaging

# Validates every packaging input without building a full release: the native
# packages manifest, the shell scripts, the universal Windows Inno installer,
# the desktop entry and the icon set. Runs on packaging changes and on demand.
# Each job writes a GitHub Actions job summary and publishes its output as an
# artifact; nothing is pushed back to the repository.

on:
  push:
    branches: [main]
    paths:
      - native-packages.yaml
      - packaging/**
      - scripts/generate-icons.py
      - tests/test_packaging_identity.py
      - tests/windows-inno-upgrade.ps1
      - tests/windows-mixed-install.ps1
      - .github/workflows/packaging.yml
  pull_request:
    paths:
      - native-packages.yaml
      - packaging/**
      - scripts/generate-icons.py
      - tests/test_packaging_identity.py
      - tests/windows-inno-upgrade.ps1
      - tests/windows-mixed-install.ps1
      - .github/workflows/packaging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux packaging inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Desktop validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
      - name: Verify branding and upgrade identities
        run: python3 -m unittest discover -s tests -v
      - name: Validate the native-packages manifest
        id: manifest
        run: |
          ruby -ryaml -e 'yaml = YAML.load_file("native-packages.yaml"); \
            abort("missing targets") unless yaml["targets"].is_a?(Hash) && yaml["targets"].any?; \
            abort("missing release repository") unless yaml.dig("release", "repository") == "Etherealmber/atlas-commerce-desktop"; \
            puts "native-packages.yaml: #{yaml["targets"].size} targets OK"' | tee packaging-linux.log
      - name: Validate shell packagers
        run: |
          bash -n packaging/macos/bundle.sh
          bash -n packaging/macos/dmg.sh
          echo "bundle.sh et dmg.sh : syntaxe OK" | tee -a packaging-linux.log
      - name: Validate the desktop entry and icons
        run: |
          # Missing assets now fail the job: validation must not be advisory.
          test -s packaging/applications/atlas-commerce-desktop.desktop
          test -s packaging/icons/atlas-commerce-desktop.svg
          test -s packaging/macos/icon-1024.png
          {
            echo "desktop entry : présent"
            echo "icône SVG : présente"
            echo "icône macOS 1024 : présente"
            desktop-file-validate packaging/applications/atlas-commerce-desktop.desktop
            echo "desktop-file-validate : OK"
          } | tee -a packaging-linux.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Packaging — entrées Linux/macOS"
            echo
            echo '```'
            cat packaging-linux.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Announce failure
        if: failure()
        run: echo "::error title=packaging Linux::Échec de validation des entrées packaging — voir l'artefact packaging-linux-log."
      - name: Announce success
        if: success()
        run: echo "::notice title=packaging Linux::manifeste native-packages, scripts shell, desktop entry et icônes validés."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packaging-linux-log
          path: packaging-linux.log
          if-no-files-found: ignore
          retention-days: 14

  linux-packages:
    # Builds the real DEB, RPM and AppImage from a release archive produced in
    # this job, then checks that the optional WebKitGTK helper is packaged.
    # Nothing is published: these packages are validation artifacts only.
    name: Linux packages contain the WebView helper
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: packaging-linux-packages
      - name: Build GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libgl1 libegl1 libxkbcommon-dev libwayland-dev \
            libwebkitgtk-6.0-dev libx11-dev libx11-xcb-dev libxcursor-dev \
            libxi-dev libxrandr-dev libarchive-tools squashfs-tools zsync
      - name: Release binary and archive
        run: |
          set -euo pipefail
          cargo build --release
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="atlas-commerce-desktop-v${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/atlas-commerce-desktop target/release/atlas-commerce-webview "dist/$name/"
          cp README.md LICENSE packaging/atlas-commerce-desktop-portable.txt "dist/$name/"
          cp --parents packaging/applications/atlas-commerce-desktop.desktop \
            packaging/icons/atlas-commerce-desktop.svg "dist/$name/"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build DEB, RPM and AppImage
        run: |
          set -uo pipefail
          gem install native-packages --version 0.10.0 --no-document
          native-packages build --version "$VERSION" \
            --target linux-amd64 --target appimage-amd64 \
            --defer-recipes --output "$RUNNER_TEMP/packages" \
            2>&1 | tee "$RUNNER_TEMP/build-packages.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -40 "$RUNNER_TEMP/build-packages.log" | while IFS= read -r line; do
              echo "::error title=linux-packages::${line:0:400}"
            done
            exit "$status"
          fi
          find "$RUNNER_TEMP/packages" -type f \( -name '*.deb' -o -name '*.rpm' \
            -o -name '*.AppImage' -o -name '*.zsync' \) -print
      - name: Assert the helper ships in every Linux package
        run: |
          set -euo pipefail
          log=packaging-linux-packages.log
          : > "$log"
          trap 'tail -20 "$log" | while IFS= read -r line; do echo "::error title=linux-packages-content::${line:0:400}"; done' ERR
          deb=$(find "$RUNNER_TEMP/packages" -name '*.deb' | head -1)
          test -n "$deb"
          dpkg-deb -c "$deb" | tee -a "$log"
          dpkg-deb -c "$deb" | grep -q '/usr/bin/atlas-commerce-webview$'
          dpkg-deb -c "$deb" | grep -q '/usr/bin/atlas-commerce-desktop$'
          rpm=$(find "$RUNNER_TEMP/packages" -name '*.rpm' | head -1)
          if [ -n "$rpm" ]; then
            rpm -qlp "$rpm" | tee -a "$log"
            rpm -qlp "$rpm" | grep -q '/usr/bin/atlas-commerce-webview$'
          fi
          appimage=$(find "$RUNNER_TEMP/packages" -name '*.AppImage' | head -1)
          test -n "$appimage"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract 'usr/bin/*' >/dev/null)
          ls -l "$RUNNER_TEMP/squashfs-root/usr/bin/" | tee -a "$log"
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/atlas-commerce-webview"
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/atlas-commerce-desktop"
          # The AppImage must not carry a private WebKit copy or it would
          # silently diverge from the host engine.
          if grep -rlE 'libwebkit2gtk|libwebkitgtk-6' "$RUNNER_TEMP/squashfs-root/usr/lib" 2>/dev/null; then
            echo "::error title=packaging Linux::The AppImage bundles WebKitGTK."; exit 1
          fi
          echo "Assistant WebKitGTK présent dans le DEB et l'AppImage." | tee -a "$log"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Paquets Linux — présence de l'assistant WebKitGTK"
            echo
            echo '```'
            cat packaging-linux-packages.log 2>/dev/null || echo "(journal absent)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: packaging-linux-packages
          path: packaging-linux-packages.log
          if-no-files-found: warn

  windows:
    name: Windows universal installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Same cache family as the CI test jobs: warm dependency builds make
      # this packaging check cheap on every push. Release builds themselves
      # stay uncached in the Release workflow (shipped-binary hygiene).
      - uses: Swatinem/rust-cache@v2
        with:
          key: packaging-windows
      - name: Build release binary
        id: build
        shell: pwsh
        run: |
          cargo build --release 2>&1 | Tee-Object packaging-windows.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path packaging-windows.log -Pattern 'error(\[|:)|panicked' |
              Select-Object -First 20 | ForEach-Object {
                echo "::error title=packaging-build::$($_.Line.Substring(0, [Math]::Min(400, $_.Line.Length)))"
              }
            exit $LASTEXITCODE
          }
      - name: Universal Inno Setup script compiles
        id: inno
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            "Inno Setup absent de l'image runner : compilation ignoree." | Tee-Object -Append packaging-windows.log
            exit 0
          }
          $binary = "$PWD\target\release\atlas-commerce-desktop.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "release binary missing: $binary"
            exit 1
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\inno-check" | Out-Null
          "ISCC: $iscc" | Tee-Object -Append packaging-windows.log
          (& $iscc /? 2>&1 | Select-Object -First 2) | Tee-Object -Append packaging-windows.log
          # The shipped setup embeds two real binaries; this check compiles the
          # same universal script with the x64 binary in both slots so every
          # architecture directive, Check function and path is exercised.
          & $iscc "/DVersion=$version" `
            "/DBinaryX64=$binary" "/DBinaryArm64=$binary" `
            "/DOutputDir=$env:RUNNER_TEMP\inno-check" packaging\windows\atlas-commerce-desktop.iss `
            2>&1 | Tee-Object -Append packaging-windows.log
          if ($LASTEXITCODE -ne 0) {
            # Surface the compiler's own lines through annotations so the
            # failure is readable even when the log archive is unreachable.
            Select-String -Path packaging-windows.log -Pattern 'Error|exception|exception|Unknown|Invalid' |
              Select-Object -First 15 | ForEach-Object {
                echo "::error title=inno-compile::$($_.Line.Substring(0, [Math]::Min(400, $_.Line.Length)))"
              }
            exit $LASTEXITCODE
          }
          Get-ChildItem "$env:RUNNER_TEMP\inno-check" | Tee-Object -Append packaging-windows.log
      - name: Exercise a real per-user Inno upgrade
        if: steps.inno.outcome == 'success'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup is required for the upgrade test' }
          $setups = @(Get-ChildItem "$env:RUNNER_TEMP\inno-check\*-setup.exe")
          if ($setups.Count -ne 1) { throw 'Expected exactly one current setup' }
          ./tests/windows-inno-upgrade.ps1 -Compiler $iscc `
            -Binary "$PWD\target\release\atlas-commerce-desktop.exe" `
            -CurrentSetup $setups[0].FullName
      - name: WiX MSI generator builds a real package
        id: msi
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          $payload = "$env:RUNNER_TEMP\msi-input"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "target\release\atlas-commerce-desktop.exe", "README.md", "LICENSE", `
            "packaging\windows\atlas-commerce-desktop-installer.txt" $payload
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          python packaging\windows\build-msi.py $payload `
            "$env:RUNNER_TEMP\atlas-commerce-desktop-test.msi" $version amd64 `
            2>&1 | Tee-Object -Append packaging-windows.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path packaging-windows.log -Pattern 'error|exception|failed|CNDL|LGHT' |
              Select-Object -First 15 | ForEach-Object {
                echo "::error title=msi-build::$($_.Line.Substring(0, [Math]::Min(400, $_.Line.Length)))"
              }
            exit $LASTEXITCODE
          }
          Get-Item "$env:RUNNER_TEMP\atlas-commerce-desktop-test.msi" |
            Tee-Object -Append packaging-windows.log
      - name: Exercise mixed MSI and Inno installations
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem "$env:RUNNER_TEMP\inno-check\*-setup.exe")
          if ($setups.Count -ne 1) { throw 'Expected exactly one Inno setup' }
          ./tests/windows-mixed-install.ps1 -Msi "$env:RUNNER_TEMP\atlas-commerce-desktop-test.msi" `
            -InnoSetup $setups[0].FullName
      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $lines = if (Test-Path packaging-windows.log) { Get-Content packaging-windows.log -Raw } else { "(log absent)" }
          # Single-quoted so the markdown backticks stay literal: a backtick
          # is PowerShell's escape character inside double-quoted strings.
          $open = '```text'
          $close = '```'
          "## Packaging — Windows`n`n$open`n$lines`n$close" |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Announce failure
        if: failure()
        shell: pwsh
        run: echo "::error title=packaging Windows::Anomalie de l'installeur Inno universel — voir l'artefact packaging-windows et le résumé du job."
      - name: Announce success
        if: success()
        shell: pwsh
        run: echo "::notice title=packaging Windows::build release, installeur Inno universel x64 + ARM64 et paquet MSI WiX valides."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packaging-windows
          path: |
            packaging-windows.log
            ${{ runner.temp }}/inno-check/*
          if-no-files-found: ignore
          retention-days: 14
