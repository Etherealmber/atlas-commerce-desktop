name: Release

# One pipeline for every desktop release, modeled on atlas-commerce-android:
#
#   Actions → Release → Run workflow, then choose
#     * repository:     the source repo (defaults to the official one),
#     * version:        a stable x.y.z — no beta/rc channel, this is prod,
#     * release_notes:  optional; empty means French notes generated from the
#                       commits since the previous tag (scripts/release-notes.py),
#     * mandatory:      marks the update as blocking in update.json,
#     * publish:        false builds every installer (incl. the Windows .msi
#                       and Inno setup .exe) and uploads them as run artifacts
#                       without touching GitHub Releases.
#
# A push of a v* tag runs the same pipeline with publishing on. The workflow
# never runs `git push`: a dispatched release creates its tag through the
# GitHub releases API and is always promoted to "latest".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Dépôt source (owner/name ou URL GitHub complète)"
        required: true
        default: "Etherealmber/atlas-commerce-desktop"
      version:
        description: "Version de production, ex. 0.2.0 (sans rc/beta — ce canal est en production)"
        required: true
      release_notes:
        description: "Notes de version (laisser vide = génération automatique depuis les commits)"
        type: string
        required: false
        default: ""
      mandatory:
        description: "Mise à jour obligatoire bloquant l'application tant qu'elle n'est pas installée"
        type: boolean
        default: false
      publish:
        description: "Publier la GitHub Release ; décocher pour seulement construire les installeurs (artefacts)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      repo: ${{ steps.meta.outputs.repo }}
      publish: ${{ steps.meta.outputs.publish }}
      mandatory: ${{ steps.meta.outputs.mandatory }}
      notes_mode: ${{ steps.meta.outputs.notes_mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release metadata
        id: meta
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MANDATORY: ${{ inputs.mandatory }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw_repo="$INPUT_REPOSITORY"
            raw_version="$INPUT_VERSION"
          else
            raw_repo="$GITHUB_REPOSITORY"
            raw_version="$GITHUB_REF_NAME"
          fi

          # Accept owner/name, full HTTPS URLs and SSH-style references.
          repo="${raw_repo#https://github.com/}"
          repo="${repo#git@github.com:}"
          repo="${repo%.git}"
          if ! printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::Dépôt invalide : $raw_repo (attendu owner/name ou une URL GitHub)"
            exit 1
          fi

          tag="v${raw_version#v}"
          version="${tag#v}"
          # Production channel: stable semver only, no pre-release suffix.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version invalide : $raw_version — ce canal publie uniquement des versions stables x.y.z."
            exit 1
          fi

          # The shipped binary reports the workspace version; the manifest and
          # every package name use the tag. A mismatch would make the updater
          # offer the "new" version forever (or gate clients on a bad manifest).
          cargo_version=$(grep -m1 -oE '^version = "[^"]+"' Cargo.toml | cut -d'"' -f2)
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::La version $version ne correspond pas à Cargo.toml ($cargo_version). Incrémentez la version du workspace puis relancez."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            publish="$INPUT_PUBLISH"
            mandatory="$INPUT_MANDATORY"
          else
            publish=true
            mandatory=false
          fi
          notes_mode=$([ -n "$INPUT_NOTES" ] && echo custom || echo auto)

          {
            echo "## Préparation de la release"
            echo
            echo "| Paramètre | Valeur |"
            echo "| --- | --- |"
            echo "| Dépôt source | \`$repo\` |"
            echo "| Tag | \`$tag\` |"
            echo "| Version | \`$version\` |"
            echo "| Publication GitHub | $publish |"
            echo "| Mise à jour obligatoire | $mandatory |"
            echo "| Notes de version | $([ "$notes_mode" = custom ] && echo "fournies manuellement" || echo "génération automatique") |"
            echo "| Déclencheur | $GITHUB_EVENT_NAME |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "repo=$repo"
            echo "publish=$publish"
            echo "mandatory=$mandatory"
            echo "notes_mode=$notes_mode"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=prepare release::Tag $tag sur $repo — publication=$publish, obligatoire=$mandatory, notes=$notes_mode."

  build:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPO: ${{ needs.prepare.outputs.repo }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the native packages' declared glibc 2.39 baseline.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package-target: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package-target: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            msvc-arch: x64
            # Plain substrings from dumpbin /headers, no regex escaping.
            pe-machine: "8664 machine"
            package-target: windows-amd64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc-arch: arm64
            pe-machine: "AA64 machine"
            package-target: windows-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libgl1 libegl1 libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # No compiler cache: published binaries never build from restored
      # Actions caches.
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Verify the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\atlas-commerce-desktop.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "atlas-commerce-desktop imports an MSVC runtime:`n$runtime" }
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '${{ matrix.pe-machine }}') {
            throw "$binary is not built for ${{ matrix.target }}:`n$headers"
          }
          $version = (& $binary --version | Out-String).Trim()
          if ($version -notmatch '^atlas-commerce-desktop \d+\.\d+\.\d+') {
            throw "Unexpected --version output: $version"
          }

      - name: Portable archive
        shell: bash
        run: |
          set -euo pipefail
          name="atlas-commerce-desktop-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # RUNNER_OS is the shell environment variable; "${runner.os}" is
          # GitHub expression syntax and would be a bash "bad substitution".
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/atlas-commerce-desktop.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/atlas-commerce-desktop" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cp packaging/atlas-commerce-desktop-portable.txt "dist/$name/"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp --parents packaging/applications/atlas-commerce-desktop.desktop \
              packaging/icons/atlas-commerce-desktop.svg "dist/$name/"
          fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      # AppImage + zsync: the update information inside the AppImage points
      # at the newest stable release's .zsync.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: '3.4'
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools squashfs-tools zsync
          gem install native-packages --version 0.10.0 --no-document
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) id=appimage-amd64 ;;
            aarch64-unknown-linux-gnu) id=appimage-arm64 ;;
            *) echo "No AppImage target for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          native-packages build --version "$RELEASE_VERSION" --target "$id" \
            --defer-recipes --output "$RUNNER_TEMP/appimage"
          cp "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage \
             "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage.zsync dist/

      # Inno Setup per-user installer (French + English wizard pages): the
      # downloadable atlas-commerce-desktop-...-setup.exe.
      - name: Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\atlas-commerce-desktop.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\atlas-commerce-desktop.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Windows Installer package (.msi), from the same binary and no C tools.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Windows'
        with:
          ruby-version: '3.4'
      - name: Windows Installer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          gem install native-packages --version 0.10.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:RELEASE_VERSION
          $payload = "dist\msi-input-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\${{ matrix.target }}\release\atlas-commerce-desktop.exe", "README.md", "LICENSE", "packaging\windows\atlas-commerce-desktop-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target ${{ matrix.package-target }} `
            --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\${{ matrix.package-target }}\msi\*.msi" dist\

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Build ${{ matrix.target }} (${{ matrix.os }})"
            echo
            echo "Tag \`$RELEASE_TAG\` — version \`$RELEASE_VERSION\`"
            echo
            echo "### Artefacts produits (\`dist/\`)"
            echo '```'
            ls -lh dist 2>/dev/null || echo "(dist absent)"
            echo '```'
            echo "### Empreintes SHA-256"
            echo '```'
            (cd dist && sha256sum * 2>/dev/null) || echo "(non disponible)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Announce result
        if: always()
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" = 0 ]; then
            echo "::error title=build-${{ matrix.target }}::Aucun artefact empaqueté pour $RELEASE_TAG — voir le résumé du job."
            exit 1
          fi
          echo "::notice title=build-${{ matrix.target }}::$count artefact(s) produit(s) pour $RELEASE_TAG sur ${{ matrix.os }} (archive, installeur Windows le cas échéant)."
      - uses: actions/upload-artifact@v8
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS universal app
    needs: prepare
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPO: ${{ needs.prepare.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/atlas-commerce-desktop \
            target/x86_64-apple-darwin/release/atlas-commerce-desktop \
            -output universal/atlas-commerce-desktop
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install native packaging
        run: gem install native-packages --version 0.10.0 --no-document
      - name: App bundle
        run: |
          set -euo pipefail
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/atlas-commerce-desktop \
            "dist/macos-input/Atlas Commerce Desktop.app" "$RELEASE_VERSION"
          cp README.md LICENSE dist/macos-input/
      - name: Package, sign and notarize macOS app
        # Credentials exist only in this step's environment: without them the
        # bundle is ad-hoc signed, which arm64 still requires to run.
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          native-packages build \
            --version "$RELEASE_VERSION" --target macos-universal --defer-recipes \
            --output "$RUNNER_TEMP/macos-packages"
          cp "$RUNNER_TEMP/macos-packages/packages/macos-universal/dmg/"*.dmg dist/
      - name: Job summary
        if: always()
        run: |
          {
            echo "## macOS universal (aarch64 + x86_64)"
            echo
            echo "Tag \`$RELEASE_TAG\` — version \`$RELEASE_VERSION\`"
            echo
            echo "### Binaire universel"
            echo '```'
            file universal/atlas-commerce-desktop 2>/dev/null || true
            lipo -info universal/atlas-commerce-desktop 2>/dev/null || true
            echo '```'
            echo "### Artefacts produits (\`dist/\`)"
            echo '```'
            ls -lh dist 2>/dev/null || echo "(dist absent)"
            echo '```'
            echo "### Empreintes SHA-256"
            echo '```'
            (cd dist && sha256sum * 2>/dev/null) || echo "(non disponible)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Announce result
        if: always()
        run: |
          dmg=$(find dist -maxdepth 1 -name '*.dmg' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$dmg" = 0 ]; then
            echo "::error title=macos-universal::Aucun DMG produit pour $RELEASE_TAG — voir le résumé du job."
            exit 1
          fi
          echo "::notice title=macos-universal::DMG universel (aarch64 + x86_64) construit pour $RELEASE_TAG."
      - uses: actions/upload-artifact@v8
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub release
    needs: [prepare, build, macos]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.macos.result == 'success'
      && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPO: ${{ needs.prepare.outputs.repo }}
      RELEASE_MANDATORY: ${{ needs.prepare.outputs.mandatory }}
      NOTES_MODE: ${{ needs.prepare.outputs.notes_mode }}
      INPUT_NOTES: ${{ inputs.release_notes }}
    # Publishing waits for maintainer approval; only this job reads the
    # signing key.
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          # Full history so release-notes.py can diff against the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes (custom or auto-generated from commits)
        run: |
          set -euo pipefail
          custom_file=""
          if [ "$NOTES_MODE" = custom ]; then
            printf '%s\n' "$INPUT_NOTES" > CUSTOM_NOTES.txt
            custom_file="--custom CUSTOM_NOTES.txt"
          fi
          python3 scripts/release-notes.py "$RELEASE_VERSION" $custom_file \
            --out-md RELEASE_NOTES.md --out-note IN_APP_NOTE.txt
          echo "--- RELEASE_NOTES.md ---"
          cat RELEASE_NOTES.md
          echo "--- note interne (update.json) ---"
          cat IN_APP_NOTE.txt
      - name: Create the GitHub Release (tag via API, no git push, always latest)
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "La release $RELEASE_TAG existe déjà : mise à jour."
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" \
              --title "Atlas Commerce Desktop $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md --latest
          else
            # --target creates the tag on this commit through the API.
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" \
              --target "$GITHUB_SHA" \
              --title "Atlas Commerce Desktop $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md --latest
          fi
      - name: Source archive
        run: |
          set -euo pipefail
          out="dist/atlas-commerce-desktop-${RELEASE_TAG}-source.tar.gz"
          # On a dispatch run the tag was just created through the API, so the
          # canonical source archive is now reachable. Fall back to a local
          # archive if the CDN lags.
          if ! curl --fail --location --retry 3 \
              "https://github.com/${RELEASE_REPO}/archive/refs/tags/${RELEASE_TAG}.tar.gz" \
              --output "$out"; then
            echo "Téléchargement de l'archive du tag impossible, archive locale."
            tar --exclude='.git' --exclude='target' --exclude='dist' \
              -czf "$out" .
          fi
      - name: Update manifest (update.json)
        run: |
          set -euo pipefail
          # Python (not a heredoc) so quotes or accents in the French note
          # can never produce invalid JSON.
          RELEASE_VERSION="$RELEASE_VERSION" RELEASE_MANDATORY="$RELEASE_MANDATORY" \
          python3 - <<'PY'
          import json, os, datetime
          manifest = {
              "version": os.environ["RELEASE_VERSION"],
              "mandatory": os.environ["RELEASE_MANDATORY"] == "true",
              "minimum_version": None,
              "notes": open("IN_APP_NOTE.txt", encoding="utf-8").read().strip(),
              "published_at": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("dist/update.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          PY
          cat dist/update.json
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # Sign the manifest when the repository opts in via the
      # UPDATE_SIGNING_ENABLED variable and holds an Ed25519 key. Without it,
      # GitHub-served sha256 checksums still guard every download; the app's
      # updater skips signature verification when no public key is compiled
      # in (ATLAS_UPDATE_PUBLIC_KEY).
      - name: Sign checksums
        if: ${{ vars.UPDATE_SIGNING_ENABLED == 'true' }}
        env:
          ATLAS_UPDATE_SIGNING_KEY: ${{ secrets.ATLAS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          gem install native-packages --version 0.10.0 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex \
            --key-env ATLAS_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex
      - name: Attach all assets
        run: gh release upload "$RELEASE_TAG" --repo "$RELEASE_REPO" dist/* --clobber
      - name: Job summary
        if: always()
        run: |
          url="https://github.com/${RELEASE_REPO}/releases/tag/${RELEASE_TAG}"
          {
            echo "## Publication de la release $RELEASE_TAG"
            echo
            echo "| Paramètre | Valeur |"
            echo "| --- | --- |"
            echo "| Dépôt | \`$RELEASE_REPO\` |"
            echo "| Mise à jour obligatoire | $RELEASE_MANDATORY |"
            echo "| Notes | $([ "$NOTES_MODE" = custom ] && echo "fournies manuellement" || echo "générées automatiquement") |"
            echo "| Signature du manifeste | $([ "${{ vars.UPDATE_SIGNING_ENABLED }}" = true ] && echo "signé Ed25519" || echo "checksums seuls") |"
            echo "| Lien | [$url]($url) |"
            echo
            echo "### Assets publiés"
            echo
            echo "| Fichier | Taille | SHA-256 |"
            echo "| --- | --- | --- |"
            cd dist
            while IFS='  ' read -r hash file; do
              [ -f "$file" ] || continue
              size=$(du -h "$file" | cut -f1)
              echo "| \`$file\` | $size | \`${hash:0:16}…\` |"
            done < checksums.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Announce result
        if: always()
        run: |
          url="https://github.com/${RELEASE_REPO}/releases/tag/${RELEASE_TAG}"
          assets=$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "${assets:-0}" -gt 0 ]; then
            echo "::notice title=release-published::$RELEASE_TAG ($assets assets, obligatoire=$RELEASE_MANDATORY, notes=$NOTES_MODE) — $url"
          else
            echo "::error title=release-publication::La release $RELEASE_TAG n'existe pas ou n'a aucun asset — voir le résumé du job."
            exit 1
          fi
