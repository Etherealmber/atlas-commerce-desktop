name: Release

# One pipeline for every desktop release, modeled on atlas-commerce-android:
#
#   Actions → Release → Run workflow, then choose
#     * repository:     the source repo (defaults to the official one),
#     * version:        a stable x.y.z — no beta/rc channel, this is prod,
#     * release_notes:  optional; empty means French notes generated from the
#                       commits since the previous tag (scripts/release-notes.py),
#     * mandatory:      marks the update as blocking in update.json,
#     * publish:        false builds every installer (the universal Windows
#                       setup .exe for x64 + ARM64, portable archives and the
#                       macOS DMG) and uploads them as run artifacts without
#                       touching GitHub Releases.
#
# A push of a v* tag runs the same pipeline with publishing on. The release
# tag itself is created through the GitHub releases API and is always promoted
# to "latest". The only `git push` in this workflow is the narrowly scoped
# workspace version bump: when the dispatched version is newer than
# Cargo.toml, prepare commits `chore(release): bump workspace … [skip ci]`
# (mirroring atlas-commerce-android) before the build jobs start. Tag pushes
# and third-party repositories cannot be auto-bumped and stay strict.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Dépôt source (owner/name ou URL GitHub complète)"
        required: true
        default: "Etherealmber/atlas-commerce-desktop"
      version:
        description: "Version de production, ex. 0.2.0 (sans rc/beta — ce canal est en production)"
        required: true
      release_notes:
        description: "Notes de version (laisser vide = génération automatique depuis les commits)"
        type: string
        required: false
        default: ""
      mandatory:
        description: "Mise à jour obligatoire bloquant l'application tant qu'elle n'est pas installée"
        type: boolean
        default: false
      publish:
        description: "Publier la GitHub Release ; décocher pour seulement construire les installeurs (artefacts)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      repo: ${{ steps.meta.outputs.repo }}
      publish: ${{ steps.meta.outputs.publish }}
      mandatory: ${{ steps.meta.outputs.mandatory }}
      notes_mode: ${{ steps.meta.outputs.notes_mode }}
      needs_bump: ${{ steps.meta.outputs.needs_bump }}
      bump_sha: ${{ steps.bump.outputs.bump_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release metadata
        id: meta
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MANDATORY: ${{ inputs.mandatory }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            raw_repo="$INPUT_REPOSITORY"
            raw_version="$INPUT_VERSION"
          else
            raw_repo="$GITHUB_REPOSITORY"
            raw_version="$GITHUB_REF_NAME"
          fi

          # Accept owner/name, full HTTPS URLs and SSH-style references.
          repo="${raw_repo#https://github.com/}"
          repo="${repo#git@github.com:}"
          repo="${repo%.git}"
          if ! printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::Dépôt invalide : $raw_repo (attendu owner/name ou une URL GitHub)"
            exit 1
          fi

          tag="v${raw_version#v}"
          version="${tag#v}"
          # Production channel: stable semver only, no pre-release suffix.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version invalide : $raw_version — ce canal publie uniquement des versions stables x.y.z."
            exit 1
          fi

          # The shipped binary reports the workspace version; the manifest and
          # every package name use the tag. A mismatch would make the updater
          # offer the "new" version forever (or gate clients on a bad manifest).
          # On a manual dispatch the chosen version bumps the workspace itself
          # (next step); tag pushes and third-party repos stay strict because
          # neither can be auto-committed safely.
          cargo_version=$(grep -m1 -oE '^version = "[^"]+"' Cargo.toml | cut -d'"' -f2)
          needs_bump=false
          if [ "$cargo_version" != "$version" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "::error::Tag $tag : Cargo.toml publie $cargo_version. Un tag immuable ne peut pas être bumpé automatiquement ; alignez le workspace puis recréez le tag."
              exit 1
            fi
            if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::La version $version ne correspond pas à Cargo.toml ($cargo_version) et le workflow ne peut pas pousser dans le dépôt tiers $repo. Alignez le workspace manuellement puis relancez."
              exit 1
            fi
            lower=$(printf '%s\n%s\n' "$cargo_version" "$version" | sort -V | head -n1)
            if [ "$lower" != "$cargo_version" ]; then
              echo "::error::La version demandée $version n'est pas strictement supérieure à la version du workspace ($cargo_version)."
              exit 1
            fi
            needs_bump=true
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            publish="$INPUT_PUBLISH"
            mandatory="$INPUT_MANDATORY"
          else
            publish=true
            mandatory=false
          fi
          notes_mode=$([ -n "$INPUT_NOTES" ] && echo custom || echo auto)

          {
            echo "## Préparation de la release"
            echo
            echo "| Paramètre | Valeur |"
            echo "| --- | --- |"
            echo "| Dépôt source | \`$repo\` |"
            echo "| Tag | \`$tag\` |"
            echo "| Version | \`$version\` |"
            echo "| Publication GitHub | $publish |"
            echo "| Mise à jour obligatoire | $mandatory |"
            echo "| Notes de version | $([ "$notes_mode" = custom ] && echo "fournies manuellement" || echo "génération automatique") |"
            echo "| Déclencheur | $GITHUB_EVENT_NAME |"
            if [ "$needs_bump" = true ]; then
              echo "| Bump Cargo.toml | automatique \`$cargo_version\` → \`$version\` (commit poussé avant build) |"
            else
              echo "| Bump Cargo.toml | non nécessaire (déjà \`$cargo_version\`) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "repo=$repo"
            echo "publish=$publish"
            echo "mandatory=$mandatory"
            echo "notes_mode=$notes_mode"
            echo "needs_bump=$needs_bump"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=prepare release::Tag $tag sur $repo — publication=$publish, obligatoire=$mandatory, notes=$notes_mode."

      # Choosing a version in the dispatch form that is newer than the
      # workspace bumps Cargo.toml immediately, so every downstream job
      # (build matrix, DMG, MSI/Inno, release) compiles and tags the exact
      # chosen version without a manual edit-and-rerun cycle.
      - name: Auto-bump workspace version
        id: bump
        if: steps.meta.outputs.needs_bump == 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/bump-workspace-version.py "$RELEASE_VERSION"
          git config user.name "atlas-ci"
          git config user.email "ci@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore(release): bump workspace to ${RELEASE_VERSION} [skip ci]"
          # A push failure must abort the release: otherwise builds would
          # compile the old version while tag/manifest advertise the new one.
          branch="${GITHUB_REF#refs/heads/}"
          if ! git push origin "HEAD:$branch"; then
            echo "::error::Impossible de pousser le bump vers $branch (protection de branche ?). La release s'arrête ici ; relancez après avoir corrigé."
            exit 1
          fi
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice title=prepare release::Workspace bumpé vers $RELEASE_VERSION et poussé sur $branch ($(git rev-parse --short HEAD))."

  build:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPO: ${{ needs.prepare.outputs.repo }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the native packages' declared glibc 2.39 baseline.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            msvc-arch: x64
            # Plain substrings from dumpbin /headers, no regex escaping.
            pe-machine: "8664 machine"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc-arch: arm64
            pe-machine: "AA64 machine"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          # Empty without a bump (tag push / equal versions): checkout
          # then falls back to its default ref. With a bump, pin the
          # exact bump commit so reruns and concurrent releases stay correct.
          ref: ${{ needs.prepare.outputs.bump_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libgl1 libegl1 libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # No compiler cache: published binaries never build from restored
      # Actions caches. The every-push CI and Packaging workflows do cache.
      - name: Build release binary
        id: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify the Windows binary
        id: verify
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\atlas-commerce-desktop.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "atlas-commerce-desktop imports an MSVC runtime:`n$runtime" }
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '${{ matrix.pe-machine }}') {
            throw "$binary is not built for ${{ matrix.target }}:`n$headers"
          }
          $version = (& $binary --version | Out-String).Trim()
          if ($version -notmatch '^atlas-commerce-desktop \d+\.\d+\.\d+') {
            throw "Unexpected --version output: $version"
          }

      - name: Portable archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          name="atlas-commerce-desktop-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # RUNNER_OS is the shell environment variable; "${runner.os}" is
          # GitHub expression syntax and would be a bash "bad substitution".
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/atlas-commerce-desktop.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/atlas-commerce-desktop" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cp packaging/atlas-commerce-desktop-portable.txt "dist/$name/"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp --parents packaging/applications/atlas-commerce-desktop.desktop \
              packaging/icons/atlas-commerce-desktop.svg "dist/$name/"
          fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      # AppImage + zsync: the update information inside the AppImage points
      # at the newest stable release's .zsync.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux'
        with:
          ruby-version: '3.4'
      - name: AppImage
        id: appimage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools squashfs-tools zsync
          gem install native-packages --version 0.10.0 --no-document
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) id=appimage-amd64 ;;
            aarch64-unknown-linux-gnu) id=appimage-arm64 ;;
            *) echo "No AppImage target for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          native-packages build --version "$RELEASE_VERSION" --target "$id" \
            --defer-recipes --output "$RUNNER_TEMP/appimage"
          cp "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage \
             "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage.zsync dist/

      # Per-architecture Windows Installer package (.msi), like Spotifast:
      # the portable zip and the universal setup.exe cover the other channels.
      # The generator is pure WiX v5 (no C tools, no native-packages gem).
      - name: Windows Installer package
        id: msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          $arch = if ("${{ matrix.target }}".StartsWith("aarch64")) { "arm64" } else { "amd64" }
          $payload = "dist\msi-input"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\atlas-commerce-desktop.exe", `
            "README.md", "LICENSE", "packaging\windows\atlas-commerce-desktop-installer.txt" $payload
          $msi = "dist\atlas-commerce-desktop-$env:RELEASE_TAG-${{ matrix.target }}.msi"
          python packaging\windows\build-msi.py $payload $msi $env:RELEASE_VERSION $arch 2>&1 |
            Tee-Object msi.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path msi.log -Pattern 'error|exception|failed|CNDL|LGHT' |
              Select-Object -First 15 | ForEach-Object {
                echo "::error title=msi-build::$($_.Line.Substring(0, [Math]::Min(400, $_.Line.Length)))"
              }
            exit $LASTEXITCODE
          }

      # The universal setup.exe (x64 + ARM64 in one installer) is assembled
      # by the separate windows-installer job once both Windows binaries exist.

      - name: Job summary
        if: always()
        shell: bash
        run: |
          outcome() { case "$1" in success) echo "✅ $2";; failure) echo "❌ $2 — échec";; skipped) echo "⊘ $2 — ignoré";; *) echo "❓ $2 — ${1:-inconnu}";; esac; }
          {
            echo "## Build ${{ matrix.target }} (${{ matrix.os }})"
            echo
            echo "Tag \`$RELEASE_TAG\` — version \`$RELEASE_VERSION\`"
            echo
            echo "### Étapes"
            echo "| Étape | Résultat |"
            echo "| --- | --- |"
            echo "| Compilation | $(outcome "${{ steps.build.outcome }}" "cargo build") |"
            echo "| Vérification binaire Windows | $(outcome "${{ steps.verify.outcome }}" "dumpbin/PE/--version") |"
            echo "| Archive portable | $(outcome "${{ steps.archive.outcome }}" "zip/tar.gz") |"
            echo "| Paquet MSI | $(outcome "${{ runner.os == 'Windows' && steps.msi.outcome || 'skipped' }}" "WiX build") |"
            echo "| AppImage | $(outcome "${{ steps.appimage.outcome }}" "AppImage + zsync") |"
            echo
            echo "### Artefacts produits (\`dist/\`)"
            echo '```'
            ls -lh dist 2>/dev/null || echo "(dist absent)"
            echo '```'
            echo "### Empreintes SHA-256"
            echo '```'
            (cd dist && sha256sum * 2>/dev/null) || echo "(non disponible)"
            echo '```'
            if [ "${{ job.status }}" = "failure" ]; then
              echo "### ❌ Le job a échoué"
              echo "Les lignes d'erreur complètes sont dans le log du job ; les échecs de"
              echo "compilation Rust commencent par \`error[...\` et ceux de packaging par"
              echo "\`Error\` / \`exit code\`. Le bot d'échec CI ouvre une issue avec le diagnostic."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Announce result
        if: always()
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" = 0 ]; then
            echo "::error title=build-${{ matrix.target }}::Aucun artefact empaqueté pour $RELEASE_TAG — voir le résumé du job."
            exit 1
          fi
          echo "::notice title=build-${{ matrix.target }}::$count artefact(s) produit(s) pour $RELEASE_TAG sur ${{ matrix.os }} (archive, installeur Windows le cas échéant)."
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    name: Windows universal installer
    needs: [prepare, build]
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPO: ${{ needs.prepare.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          # Empty without a bump (tag push / equal versions): checkout
          # then falls back to its default ref. With a bump, pin the
          # exact bump commit so reruns and concurrent releases stay correct.
          ref: ${{ needs.prepare.outputs.bump_sha }}
      # One portable zip per architecture, produced by the build matrix.
      - uses: actions/download-artifact@v8
        with:
          name: x86_64-pc-windows-msvc
          path: artifacts/x64
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-pc-windows-msvc
          path: artifacts/arm64
      # dumpbin ships with the MSVC tools; load them before reading PE headers.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Extract both binaries
        id: extract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force binaries/x64, binaries/arm64 | Out-Null
          Expand-Archive (Get-ChildItem artifacts/x64/*.zip | Select-Object -First 1).FullName -DestinationPath binaries/x64
          Expand-Archive (Get-ChildItem artifacts/arm64/*.zip | Select-Object -First 1).FullName -DestinationPath binaries/arm64
          $x64 = (Get-ChildItem -Recurse binaries/x64 -Filter atlas-commerce-desktop.exe | Select-Object -First 1).FullName
          $arm64 = (Get-ChildItem -Recurse binaries/arm64 -Filter atlas-commerce-desktop.exe | Select-Object -First 1).FullName
          if (-not $x64 -or -not $arm64) { throw "Missing one of the release binaries: x64=$x64 arm64=$arm64" }
          # Architecture sanity check before the two binaries enter one setup.
          $x64Headers = (& dumpbin /headers $x64 | Out-String)
          $armHeaders = (& dumpbin /headers $arm64 | Out-String)
          if ($x64Headers -notmatch '8664 machine') { throw "x64 binary has the wrong PE machine type`n$x64Headers" }
          if ($armHeaders -notmatch 'AA64 machine') { throw "ARM64 binary has the wrong PE machine type`n$armHeaders" }
          "x64: $x64"
          "arm64: $arm64"
      - name: Build the universal Inno setup
        id: inno
        shell: pwsh
        run: |
          $x64 = (Get-ChildItem -Recurse binaries/x64 -Filter atlas-commerce-desktop.exe | Select-Object -First 1).FullName
          $arm64 = (Get-ChildItem -Recurse binaries/arm64 -Filter atlas-commerce-desktop.exe | Select-Object -First 1).FullName
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DVersion=$env:RELEASE_VERSION" `
            "/DBinaryX64=$x64" "/DBinaryArm64=$arm64" `
            "/DOutputDir=$PWD\dist" packaging\windows\atlas-commerce-desktop.iss 2>&1 |
            Tee-Object inno.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path inno.log -Pattern 'Error|Unknown|Invalid|exception' |
              Select-Object -First 15 | ForEach-Object {
                echo "::error title=inno-compile::$($_.Line.Substring(0, [Math]::Min(400, $_.Line.Length)))"
              }
            exit $LASTEXITCODE
          }
      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          # Build markdown fences without backtick literals: in double-quoted
          # PowerShell strings the backtick is the escape character.
          $fence = [string][char]96 * 3
          $artifacts = (Get-ChildItem dist -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize | Out-String)
          $innoTail = (Get-Content inno.log -Tail 25 -ErrorAction SilentlyContinue) -join "`n"
          $summary = @(
            '## Windows universal installer (x64 + ARM64)',
            '',
            "Tag $env:RELEASE_TAG - version $env:RELEASE_VERSION",
            '',
            '### Artefacts produits (dist/)',
            $fence,
            $artifacts,
            $fence,
            '### Fin du log Inno Setup',
            ($fence + 'text'),
            $innoTail,
            $fence
          )
          $summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Announce result
        if: always()
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe -ErrorAction SilentlyContinue
          if (-not $setup) {
            echo "::error title=windows-installer::Aucun installeur universel produit — voir le résumé du job et inno.log."
            exit 1
          }
          echo "::notice title=windows-installer::Installeur universel x64 + ARM64 construit : $($setup.Name)."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-universal
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS universal app
    needs: prepare
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPO: ${{ needs.prepare.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          # Empty without a bump (tag push / equal versions): checkout
          # then falls back to its default ref. With a bump, pin the
          # exact bump commit so reruns and concurrent releases stay correct.
          ref: ${{ needs.prepare.outputs.bump_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/atlas-commerce-desktop \
            target/x86_64-apple-darwin/release/atlas-commerce-desktop \
            -output universal/atlas-commerce-desktop
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install native packaging
        run: gem install native-packages --version 0.10.0 --no-document
      - name: App bundle
        run: |
          set -euo pipefail
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/atlas-commerce-desktop \
            "dist/macos-input/Atlas Commerce Desktop.app" "$RELEASE_VERSION"
          cp README.md LICENSE dist/macos-input/
      - name: Package, sign and notarize macOS app
        # Credentials exist only in this step's environment: without them the
        # bundle is ad-hoc signed, which arm64 still requires to run.
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          native-packages build \
            --version "$RELEASE_VERSION" --target macos-universal --defer-recipes \
            --output "$RUNNER_TEMP/macos-packages"
          cp "$RUNNER_TEMP/macos-packages/packages/macos-universal/dmg/"*.dmg dist/
      - name: Job summary
        if: always()
        run: |
          {
            echo "## macOS universal (aarch64 + x86_64)"
            echo
            echo "Tag \`$RELEASE_TAG\` — version \`$RELEASE_VERSION\`"
            echo
            echo "### Binaire universel"
            echo '```'
            file universal/atlas-commerce-desktop 2>/dev/null || true
            lipo -info universal/atlas-commerce-desktop 2>/dev/null || true
            echo '```'
            echo "### Artefacts produits (\`dist/\`)"
            echo '```'
            ls -lh dist 2>/dev/null || echo "(dist absent)"
            echo '```'
            echo "### Empreintes SHA-256"
            echo '```'
            (cd dist && sha256sum * 2>/dev/null) || echo "(non disponible)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Announce result
        if: always()
        run: |
          dmg=$(find dist -maxdepth 1 -name '*.dmg' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$dmg" = 0 ]; then
            echo "::error title=macos-universal::Aucun DMG produit pour $RELEASE_TAG — voir le résumé du job."
            exit 1
          fi
          echo "::notice title=macos-universal::DMG universel (aarch64 + x86_64) construit pour $RELEASE_TAG."
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub release
    needs: [prepare, build, macos, windows-installer]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.macos.result == 'success'
      && needs.windows-installer.result == 'success'
      && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPO: ${{ needs.prepare.outputs.repo }}
      RELEASE_MANDATORY: ${{ needs.prepare.outputs.mandatory }}
      NOTES_MODE: ${{ needs.prepare.outputs.notes_mode }}
      INPUT_NOTES: ${{ inputs.release_notes }}
    # Publishing waits for maintainer approval; only this job reads the
    # signing key.
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          # Empty without a bump (tag push / equal versions): checkout
          # then falls back to its default ref. With a bump, pin the
          # exact bump commit so reruns and concurrent releases stay correct.
          ref: ${{ needs.prepare.outputs.bump_sha }}
          # Full history so release-notes.py can diff against the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes (custom or auto-generated from commits)
        run: |
          set -euo pipefail
          custom_file=""
          if [ "$NOTES_MODE" = custom ]; then
            printf '%s\n' "$INPUT_NOTES" > CUSTOM_NOTES.txt
            custom_file="--custom CUSTOM_NOTES.txt"
          fi
          python3 scripts/release-notes.py "$RELEASE_VERSION" $custom_file \
            --out-md RELEASE_NOTES.md --out-note IN_APP_NOTE.txt
          echo "--- RELEASE_NOTES.md ---"
          cat RELEASE_NOTES.md
          echo "--- note interne (update.json) ---"
          cat IN_APP_NOTE.txt
      # Spotifast publishes through softprops/action-gh-release rather than
      # the raw gh CLI: the action authenticates explicitly with the job's
      # GITHUB_TOKEN (contents: write) instead of relying on gh's ambient
      # auth detection, which failed with exit code 4 under the
      # release-signing environment. It creates the tag through the API on
      # the current commit, and re-runs update the same release instead of
      # failing on an existing tag.
      - name: Create the GitHub Release as a draft (tag via API, no git push)
        id: release
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          # github.sha is the pre-bump event commit; when prepare pushed the
          # version-bump commit, the tag must target that new sha instead.
          target_commitish: ${{ needs.prepare.outputs.bump_sha || github.sha }}
          name: Atlas Commerce Desktop ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE_NOTES.md
          # Draft while assets upload: a published release with missing files
          # is what made the in-app updater answer 404 during the publish
          # window. It is promoted to public (and latest) only after every
          # asset and checksum is attached, in the Publish step below.
          draft: true
      - name: Source archive
        run: |
          set -euo pipefail
          out="dist/atlas-commerce-desktop-${RELEASE_TAG}-source.tar.gz"
          # Prefer GitHub's canonical tag archive. If the tag was just
          # created through the API and its archive has not propagated yet,
          # archive the exact release commit locally — never the working
          # tree, which holds uncommitted generated note files that do not
          # belong in a source tarball.
          if ! curl --fail --location --retry 3 \
              "https://github.com/${RELEASE_REPO}/archive/refs/tags/${RELEASE_TAG}.tar.gz" \
              --output "$out"; then
            echo "Archive du tag indisponible, archive du commit de release."
            git archive --format=tar.gz \
              --output="$out" \
              "${{ needs.prepare.outputs.bump_sha || github.sha }}"
          fi
      - name: Per-architecture setup aliases
        run: |
          set -euo pipefail
          # fastframe-update selects <slug>-v<ver>-<target>-setup.exe for an
          # Inno-based copy (target x86_64/aarch64-pc-windows-msvc). The
          # release ships one universal setup that handles both arches, so
          # publish it under both names the updater may request. Must run
          # before Checksums so every alias gets a checksum entry.
          universal="dist/atlas-commerce-desktop-${RELEASE_TAG}-setup.exe"
          test -f "$universal"
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            cp "$universal" "dist/atlas-commerce-desktop-${RELEASE_TAG}-${target}-setup.exe"
          done
          ls -1 dist/*-setup.exe
      - name: Update manifest (update.json)
        run: |
          set -euo pipefail
          # Python (not a heredoc) so quotes or accents in the French note
          # can never produce invalid JSON.
          RELEASE_VERSION="$RELEASE_VERSION" RELEASE_MANDATORY="$RELEASE_MANDATORY" \
          python3 - <<'PY'
          import json, os, datetime
          manifest = {
              "version": os.environ["RELEASE_VERSION"],
              "mandatory": os.environ["RELEASE_MANDATORY"] == "true",
              "minimum_version": None,
              "notes": open("IN_APP_NOTE.txt", encoding="utf-8").read().strip(),
              "published_at": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("dist/update.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          PY
          cat dist/update.json
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # Sign the manifest when the repository opts in via the
      # UPDATE_SIGNING_ENABLED variable and holds an Ed25519 key. Without it,
      # GitHub-served sha256 checksums still guard every download; the app's
      # updater skips signature verification when no public key is compiled
      # in (ATLAS_UPDATE_PUBLIC_KEY).
      - name: Sign checksums
        if: ${{ vars.UPDATE_SIGNING_ENABLED == 'true' }}
        env:
          ATLAS_UPDATE_SIGNING_KEY: ${{ secrets.ATLAS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          gem install native-packages --version 0.10.0 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex \
            --key-env ATLAS_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex
      # Same action as the create step: it resolves the existing release and
      # uploads every artifact, regenerating checksums/signature first. A
      # failed upload fails the job, so the announce step never needs gh.
      - name: Attach all assets
        id: upload
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          # Stay a draft: publishing happens only after this succeeds.
          draft: true
      - name: Publish the release (only now is it visible to updaters)
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: false
          make_latest: 'true'
      - name: Job summary
        if: always()
        run: |
          url="https://github.com/${RELEASE_REPO}/releases/tag/${RELEASE_TAG}"
          {
            echo "## Publication de la release $RELEASE_TAG"
            echo
            echo "| Paramètre | Valeur |"
            echo "| --- | --- |"
            echo "| Dépôt | \`$RELEASE_REPO\` |"
            echo "| Mise à jour obligatoire | $RELEASE_MANDATORY |"
            echo "| Notes | $([ "$NOTES_MODE" = custom ] && echo "fournies manuellement" || echo "générées automatiquement") |"
            echo "| Signature du manifeste | $([ "${{ vars.UPDATE_SIGNING_ENABLED }}" = true ] && echo "signé Ed25519" || echo "checksums seuls") |"
            echo "| Lien | [$url]($url) |"
            echo
            if [ -f dist/checksums.txt ]; then
              echo "### Assets publiés"
              echo
              echo "| Fichier | Taille | SHA-256 |"
              echo "| --- | --- | --- |"
              cd dist
              while IFS='  ' read -r hash file; do
                [ -f "$file" ] || continue
                size=$(du -h "$file" | cut -f1)
                echo "| \`$file\` | $size | \`${hash:0:16}…\` |"
              done < checksums.txt
            else
              echo "### Assets"
              echo
              echo "Aucun asset produit — une étape amont a échoué, voir les annotations."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # No gh here: the upload step's own conclusion is the source of truth,
      # and its action fails the job whenever an asset cannot be published.
      - name: Announce result
        if: always()
        run: |
          url="${{ steps.upload.outputs.url }}"
          if [ -n "$url" ]; then
            count=$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')
            echo "::notice title=release-published::$RELEASE_TAG ($count fichiers publiés, obligatoire=$RELEASE_MANDATORY, notes=$NOTES_MODE) — $url"
          else
            echo "::error title=release-publication::La publication de $RELEASE_TAG a échoué — voir le résumé du job et les annotations."
            exit 1
          fi
