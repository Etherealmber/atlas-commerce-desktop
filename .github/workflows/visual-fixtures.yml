name: Visual fixtures
on:
  pull_request:
    paths:
      - 'crates/ui/**'
      - '.github/workflows/visual-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    name: Offline desktop screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install virtual display and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils xdotool imagemagick libdbus-1-3 libgl1 libegl1 libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libwebkitgtk-6.0-dev cmake
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: visual-fixtures
      - name: Build offline fixture
        run: cargo build -p atlas-ui --features visual-fixtures --example visual_fixture
      - name: Exercise the isolated WebKitGTK window
        run: |
          # Ubuntu's runner restricts unprivileged namespaces via AppArmor,
          # which prevents WebKit's bubblewrap sandbox from starting. Relax
          # that VM-only restriction; WebKit's sandbox remains enabled.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          set +e
          xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p atlas-webview-linux --bin atlas-commerce-webview \
            window::tests::opens_and_destroys_an_ephemeral_window -- --ignored --test-threads=1 > /tmp/webkit-smoke.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -40 /tmp/webkit-smoke.log | while IFS= read -r line; do
              echo "::error title=WebKitGTK::${line:0:400}"
            done
          fi
          exit "$result"
      - name: Render fictional screens under Xvfb
        run: |
          mkdir -p visual-output
          xvfb-run -a -s '-screen 0 1280x800x24' bash -eu -o pipefail -c '
            for page in client-receivables login login-qr clients client-editor client-invoices products stock sales quotes expenses vendors employees settings delivery agent; do
              ./target/debug/examples/visual_fixture "$page" >"visual-output/$page.log" 2>&1 &
              pid=$!
              sleep 8
              xwininfo -root -tree > "visual-output/$page.windows" || true
              if ! kill -0 "$pid" 2>/dev/null; then cat "visual-output/$page.log"; exit 1; fi
              import -window root "visual-output/$page.png"
              colors=$(identify -format "%k" "visual-output/$page.png")
              if [ "$colors" -lt 20 ]; then echo "Blank screenshot: $page ($colors colors)"; kill "$pid"; exit 1; fi
              if [ "$page" = client-invoices ]; then
                # Bring the selected client invoice section into view.
                xdotool mousemove 900 500 click --repeat 5 --delay 80 5
                sleep 1
                import -window root visual-output/client-invoices-scrolled.png
              fi
              if [ "$page" = client-editor ]; then
                # Scroll the form independently, then cancel using the fixed footer.
                xdotool mousemove 720 400 click --repeat 7 --delay 80 5
                sleep 1
                import -window root visual-output/client-editor-scrolled.png
                changed=$(compare -metric AE "visual-output/client-editor.png" visual-output/client-editor-scrolled.png null: 2>&1 || true)
                if ! [[ "$changed" =~ ^[0-9]+$ ]] || [ "$changed" -lt 3000 ]; then
                  echo "Client editor did not scroll: $changed"; kill "$pid"; exit 1
                fi
                xdotool mousemove 723 670 click 1
                sleep 1
                import -window root visual-output/client-editor-cancelled.png
                changed=$(compare -metric AE "visual-output/client-editor-scrolled.png" visual-output/client-editor-cancelled.png null: 2>&1 || true)
                if ! [[ "$changed" =~ ^[0-9]+$ ]] || [ "$changed" -lt 10000 ]; then
                  echo "Client editor cancel click did not close the dialog: $changed"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = agent ]; then
                # Click the visible close control in the 1280x800 fixture.
                xdotool mousemove 1230 90 click 1
                sleep 2
                import -window root visual-output/agent-closed.png
                changed=$(compare -metric AE "visual-output/agent.png" visual-output/agent-closed.png null: 2>&1 || true)
                if ! [[ "$changed" =~ ^[0-9]+$ ]] || [ "$changed" -lt 10000 ]; then
                  echo "Agent close click did not change the screen: $changed"; kill "$pid"; exit 1
                fi
              fi
              kill "$pid"
              wait "$pid" || true
            done
          '
          test -s visual-output/clients.png
      - name: Surface fixture errors
        if: failure()
        run: |
          for file in visual-output/*.log visual-output/*.windows; do
            if [ -f "$file" ]; then
              echo "::error title=Fixture $(basename "$file")::$(tail -c 1800 "$file" | base64 -w0)"
            fi
          done
      - name: Review receivables screenshot
        run: |
          convert visual-output/client-receivables.png -resize 640x400 -quality 30 /tmp/review.jpg
          base64 -w0 /tmp/review.jpg | fold -w 2500 > /tmp/review.parts
          count=0
          while IFS= read -r line || [ -n "$line" ]; do
            printf '::notice title=FixtureImage-receivables-%03d::%s\n' "$count" "$line"
            count=$((count + 1))
          done < /tmp/review.parts
      - name: Review quote list screenshot
