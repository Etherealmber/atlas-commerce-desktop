name: Visual fixtures
on:
  pull_request:
    paths:
      - 'crates/ui/**'
      - '.github/workflows/visual-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    name: Offline desktop screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install virtual display and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils xdotool imagemagick zbar-tools libdbus-1-3 libgl1 libegl1 libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libwebkitgtk-6.0-dev cmake
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: visual-fixtures
      - name: Build offline fixture
        run: cargo build -p atlas-ui --features visual-fixtures --example visual_fixture
      - name: Render fictional screens under Xvfb
        run: |
          mkdir -p visual-output
          xvfb-run -a -s '-screen 0 1280x800x24' bash -eu -o pipefail -c '
            for page in login-reference-default-light-1280x800 login-reference-default-dark-1280x800 login-reference-focus-light-1280x800 login-reference-focus-dark-1280x800 login-reference-checked-light-1280x800 login-reference-checked-dark-1280x800 login-reference-error-light-1280x800 login-reference-error-dark-1280x800 login-reference-otp-light-1280x800 login-reference-otp-dark-1280x800 login-reference-claimed-light-1280x800 login-reference-claimed-dark-1280x800  dashboard dashboard-dark alerts-popover attendance attendance-disabled inventory-ops cash-shifts payroll mobile-actions stock-report palette-narrow stock-shortcut vendor-payables client-receivables login login-dark login-wait login-qr login-v2 clients clients-dark clients-narrow client-editor client-wizard client-invoices products products-narrow product-wizard stock sales quotes expenses finance-report vendors employees employee-editor employee-editor-narrow employee-wizard settings settings-narrow settings-dark update-dialog update-dialog-dark delivery agent; do
              echo "Rendering fixture: $page"
              ATLAS_FIXTURE_WIZARD=1 ./target/debug/examples/visual_fixture "$page" >"visual-output/$page.log" 2>&1 &
              pid=$!
              sleep 8
              xwininfo -root -tree > "visual-output/$page.windows" || true
              if ! kill -0 "$pid" 2>/dev/null; then cat "visual-output/$page.log"; exit 1; fi
              if [[ "$page" = login-reference-* ]]; then
                window=$(xdotool search --name "Atlas fixture" | head -n 1)
                import -window "$window" "visual-output/$page.png"
              else
                import -window root "visual-output/$page.png"
              fi
              colors=$(identify -format "%k" "visual-output/$page.png")
              if [ "$colors" -lt 20 ]; then echo "Blank screenshot: $page ($colors colors)"; kill "$pid"; exit 1; fi
              if [ "$page" = dashboard ] || [ "$page" = dashboard-dark ]; then
                # A nonblank window alone is insufficient: the sidebar can be
                # visible while the page body has accidentally been clipped.
                body_colors=$(convert "visual-output/$page.png" -crop 900x500+250+120 +repage -format "%k" info:)
                if [ "$body_colors" -lt 80 ]; then
                  echo "Dashboard body is blank: $page ($body_colors colors)"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = login-qr ]; then
                # Decode the actual rendered, branded QR, not just its source data.
                decoded=$(zbarimg --quiet --raw "visual-output/login-qr.png" 2>/dev/null || true)
                if [ "$decoded" != "https://fixture.invalid/login/qr?t=fictional&mode=pc" ]; then
                  echo "The branded login QR could not be decoded"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = login-v2 ]; then
                decoded=$(zbarimg --quiet --raw "visual-output/login-v2.png" 2>/dev/null || true)
                expected="https://stock.exemple.invalid/login/desktop-phone#request_id=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                if [ "$decoded" != "$expected" ]; then
                  echo "The native v2 QR could not be decoded"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = employee-editor-narrow ]; then
                # The backdrop must receive clicks outside the dialog even on a compact window.
                window=$(xdotool search --name "Atlas fixture" | head -n 1)
                xdotool windowfocus "$window" mousemove --window "$window" 10 100 click 1
                sleep 1
                import -window root visual-output/employee-editor-narrow-closed.png
                changed=$(compare -metric AE "visual-output/employee-editor-narrow.png" visual-output/employee-editor-narrow-closed.png null: 2>&1 || true)
                if ! awk -v n="$changed" "BEGIN { exit !(n ~ /^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$/ && n >= 10000) }"; then
                  echo "Employee dialog did not close from its backdrop: $changed"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = alerts-popover ]; then
                window=$(xdotool search --name "Atlas fixture" | head -n 1)
                xdotool windowfocus "$window" key Escape
                sleep 1
                import -window root visual-output/alerts-popover-closed.png
                changed=$(compare -metric AE visual-output/alerts-popover.png visual-output/alerts-popover-closed.png null: 2>&1 || true)
                if ! awk -v n="$changed" "BEGIN { exit !(n ~ /^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$/ && n >= 1000) }"; then
                  echo "Notification popover did not close with Escape: $changed"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = update-dialog ] || [ "$page" = update-dialog-dark ]; then
                window=$(xdotool search --name "Atlas fixture" | head -n 1)
                xdotool windowfocus "$window" key Escape
                sleep 1
                import -window root "visual-output/$page-closed.png"
                changed=$(compare -metric AE "visual-output/$page.png" "visual-output/$page-closed.png" null: 2>&1 || true)
                if ! awk -v n="$changed" "BEGIN { exit !(n ~ /^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$/ && n >= 10000) }"; then
                  echo "Update dialog did not close with Escape: $changed"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = palette-narrow ]; then
                # Exercise Escape in the actual narrow window, not a mock DOM.
                window=$(xdotool search --name "Atlas fixture" | head -n 1)
                xdotool windowfocus "$window" key Escape
                sleep 1
                import -window root visual-output/palette-narrow-closed.png
                changed=$(compare -metric AE visual-output/palette-narrow.png visual-output/palette-narrow-closed.png null: 2>&1 || true)
                if ! awk -v n="$changed" "BEGIN { exit !(n ~ /^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$/ && n >= 10000) }"; then
                  echo "Narrow palette did not close: $changed"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = stock-shortcut ]; then
                # Check navigation AND keyboard focus using only fictional input.
                window=$(xdotool search --name "Atlas fixture" | head -n 1)
                xdotool windowfocus "$window" key ctrl+shift+k
                sleep 1
                xdotool type --clearmodifiers SKU42
                sleep 1
                if ! grep -q FIXTURE_STOCK_SHORTCUT_OK "visual-output/$page.log"; then
                  import -window root visual-output/stock-shortcut-failed.png
                  echo "Stock shortcut did not focus the product search"; kill "$pid"; exit 1
                fi
                import -window root visual-output/stock-shortcut-focused.png
              fi
              if [ "$page" = client-invoices ]; then
                # Bring the selected client invoice section into view.
                xdotool mousemove 900 500 click --repeat 5 --delay 80 5
                sleep 1
                import -window root visual-output/client-invoices-scrolled.png
              fi
              if [ "$page" = client-wizard ] || [ "$page" = product-wizard ] || [ "$page" = employee-wizard ]; then
                # Click the real Next control through every non-final step in a compact window.
                window=$(xdotool search --name "Atlas fixture" | head -n 1)
                xdotool windowfocus "$window"
                count=2
                if [ "$page" = product-wizard ] || [ "$page" = employee-wizard ]; then count=4; fi
                for step in $(seq 1 "$count"); do
                  pos=$(grep "FIXTURE_NEXT_POSITION" "visual-output/$page.log" | tail -n 1 || true)
                  read -r _ x y <<< "$pos"
                  if [ -z "${x:-}" ] || [ -z "${y:-}" ]; then echo "Next button not found"; kill "$pid"; exit 1; fi
                  xdotool mousemove --window "$window" "$x" "$y" click 1
                  sleep 1
                  if ! grep -q "FIXTURE_WIZARD_STEP $step" "visual-output/$page.log"; then
                    import -window root "visual-output/$page-step-$step-failed.png"
                    echo "Wizard $page did not advance to step $step"; kill "$pid"; exit 1
                  fi
                done
                import -window root "visual-output/$page-final.png"
              fi
              if [ "$page" = client-editor ]; then
                # The client editor now uses compact wizard steps rather than
                # one long scrolling form. Escape closes the modal without saving.
                window=$(xdotool search --name "Atlas fixture" | head -n 1)
                xdotool windowfocus "$window" key Escape
                sleep 1
                import -window root visual-output/client-editor-cancelled.png
                changed=$(compare -metric AE "visual-output/client-editor.png" visual-output/client-editor-cancelled.png null: 2>&1 || true)
                if ! awk -v n="$changed" "BEGIN { exit !(n ~ /^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$/ && n >= 10000) }"; then
                  echo "::error title=Client editor Escape::Pixel difference: $changed"; kill "$pid"; exit 1
                fi
              fi
              if [ "$page" = agent ]; then
                # Click the visible close control in the 1280x800 fixture.
                xdotool mousemove 1230 90 click 1
                sleep 2
                import -window root visual-output/agent-closed.png
                changed=$(compare -metric AE "visual-output/agent.png" visual-output/agent-closed.png null: 2>&1 || true)
                if ! awk -v n="$changed" "BEGIN { exit !(n ~ /^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$/ && n >= 10000) }"; then
                  echo "Agent close click did not change the screen: $changed"; kill "$pid"; exit 1
                fi
              fi
              kill "$pid"
              wait "$pid" || true
            done
          '
          # Exercise the top-band placement separately at a genuinely wide viewport.
          xvfb-run -a -s '-screen 0 1920x900x24' bash -eu -o pipefail -c '
            for page in dashboard-wide products-wide expenses-wide; do
              ./target/debug/examples/visual_fixture "$page" >"visual-output/$page.log" 2>&1 &
              pid=$!
              sleep 8
              if ! kill -0 "$pid" 2>/dev/null; then cat "visual-output/$page.log"; exit 1; fi
              import -window root "visual-output/$page.png"
              colors=$(identify -format "%k" "visual-output/$page.png")
              if [ "$colors" -lt 20 ]; then echo "Blank screenshot: $page"; kill "$pid"; exit 1; fi
              kill "$pid"
              wait "$pid" || true
            done
          '
          test -s visual-output/clients.png
      - name: Surface fixture errors
        if: failure()
        run: |
          echo "::error title=Fixture files::$(find visual-output -maxdepth 1 -type f -printf '%f ' | sort)"
          for file in visual-output/*.log visual-output/*.windows; do
            if [ -f "$file" ]; then
              echo "::error title=Fixture $(basename "$file")::$(tail -c 1800 "$file" | base64 -w0)"
            fi
          done
      - name: Upload fixture diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-fixture-failure-diagnostics
          path: visual-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Render large login fixtures
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' bash -eu -o pipefail -c '
            for theme in light dark; do
              page="login-reference-default-$theme-1440x900"
              ./target/debug/examples/visual_fixture "$page" >"visual-output/$page.log" 2>&1 &
              pid=$!
              sleep 8
              if ! kill -0 "$pid" 2>/dev/null; then cat "visual-output/$page.log"; exit 1; fi
              import -window root "visual-output/$page.png"
              kill "$pid"
              wait "$pid" || true
            done
          '
      - name: Review login fallback screenshot
        if: always()
        continue-on-error: true
        run: |
          convert visual-output/login.png -resize 640x400 -quality 30 /tmp/review.jpg
          base64 -w0 /tmp/review.jpg | fold -w 2500 > /tmp/review.parts
          count=0
          while IFS= read -r line || [ -n "$line" ]; do
            printf '::notice title=FixtureImage-login-%03d::%s\n' "$count" "$line"
            count=$((count + 1))
          done < /tmp/review.parts
      - name: Review login waiting screenshot
