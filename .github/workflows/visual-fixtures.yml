      - name: Compare login reference images
        if: always()
        run: |
          mkdir -p visual-output
          for reference in tests/visual/login-reference/*.png; do
            name=$(basename "$reference" .png)
            actual="visual-output/login-reference-$name.png"
            if [ -s "$actual" ]; then
              convert "$reference" "$actual" +append "visual-output/login-compare-$name.png"
              compare -metric AE "$reference" "$actual" "visual-output/login-diff-$name.png" 2>"visual-output/login-diff-$name.txt" || test "$?" -eq 1
            fi
          done
      - name: Publish offline screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-desktop-screenshots
          path: visual-output/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Verify required screenshots exist
        if: always()
        run: |
          missing=0
          for page in login login-dark dashboard dashboard-dark clients clients-dark settings settings-dark update-dialog update-dialog-dark delivery client-editor; do
            if [ ! -s "visual-output/$page.png" ]; then
              echo "::error::Missing required screenshot: $page.png"
              missing=1
            fi
          done
          exit "$missing"
      - name: Exercise the isolated WebKitGTK window
        run: |
          # Ubuntu's runner restricts unprivileged namespaces via AppArmor,
          # which prevents WebKit's bubblewrap sandbox from starting. Relax
          # that VM-only restriction; WebKit's sandbox remains enabled.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          set +e
          timeout 360s xvfb-run -a -s '-screen 0 1280x800x24' cargo test -p atlas-webview-linux --bin atlas-commerce-webview \
            window::tests::opens_and_destroys_an_ephemeral_window -- --ignored --test-threads=1 > /tmp/webkit-smoke.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -40 /tmp/webkit-smoke.log | while IFS= read -r line; do
              echo "::error title=WebKitGTK::${line:0:400}"
            done
          fi
          exit "$result"

      - name: Commit fictional screenshots to this branch
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          # Never publish on top of an unseen change or to a fork/default branch.
          if [ "$HEAD_BRANCH" != "arena/7ea606a3-atlas-commerce-desktop" ]; then
            echo "Skipping screenshot publication outside this PR branch."
            exit 0
          fi
          git fetch origin "$HEAD_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::Branch moved during rendering; refusing to overwrite newer screenshots."
            exit 1
          fi
          git checkout -B "$HEAD_BRANCH" "$EXPECTED_SHA"
          mkdir -p docs/parity/shots
          find visual-output -maxdepth 1 -type f -name '*.png' -exec cp -f -t docs/parity/shots -- {} +
          git add -- docs/parity/shots/*.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capturer les images de parité [skip ci]'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
