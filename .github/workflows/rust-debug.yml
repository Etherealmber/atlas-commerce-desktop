name: Rust debug loop

# Temporary diagnostics harness: runs the Rust toolchain where it exists
# (GitHub Actions), pushes rustfmt fixes back to the triggering branch and
# writes the compiler output to a branch readable through the API. Delete
# once CI is green.

on:
  push:
    branches: [arena/fe5868a7-atlas-commerce-desktop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-debug
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libgl1 libegl1 libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Resolve dependencies
        run: cargo fetch
      - name: Format (captured, non-fatal)
        run: |
          cargo fmt --all --check > fmt.log 2>&1 || true
          # Try to format anyway; a parse error stays in fmt.log.
          cargo fmt --all >> fmt.log 2>&1 || true
      - name: Push formatting fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: rustfmt" || true
            git push || true
          else
            echo "already formatted"
          fi
      - name: Compile and test (captured)
        run: |
          set +e
          cargo test --workspace --no-run > compile.log 2>&1
          echo "EXIT:$?" >> compile.log
          cargo test --workspace > test.log 2>&1
          echo "EXIT:$?" >> test.log
          cargo clippy --all-targets -- -D warnings > clippy.log 2>&1
          echo "EXIT:$?" >> clippy.log
          cargo clippy --all-targets --all-features -- -D warnings >> clippy.log 2>&1
          echo "EXIT:$?" >> clippy.log
          RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps > doc.log 2>&1
          echo "EXIT:$?" >> doc.log
          true
      - name: OSV scanner (captured, non-fatal)
        run: |
          set +e
          # Configured run: osv-scanner.toml in the workspace root is picked
          # up automatically and must leave the scan clean.
          docker run --rm -v "$PWD":/src -w /src \
            ghcr.io/google/osv-scanner-action:v2.7.0 \
            scan source --lockfile=Cargo.lock > osv.log 2>&1
          echo "EXIT:$?" >> osv.log
          # Raw run: same lockfile in a directory without a config, so the
          # unfiltered advisory list is visible for auditing.
          mkdir -p osv-raw && cp Cargo.lock osv-raw/
          docker run --rm -v "$PWD/osv-raw":/raw -w /raw \
            ghcr.io/google/osv-scanner-action:v2.7.0 \
            scan source --lockfile=Cargo.lock > osv-raw.log 2>&1
          echo "EXIT:$?" >> osv-raw.log
          true
      - name: Publish diagnostics branch
        run: |
          git checkout -b ci-debug-log
          git add -f fmt.log compile.log test.log clippy.log doc.log osv.log osv-raw.log Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: rust diagnostics"
          git push --force origin ci-debug-log
