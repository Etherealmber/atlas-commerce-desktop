name: CI failure bot

# Watches the three delivery workflows. When a run finishes, it checks out
# the exact revision (on failure), downloads the logs, extracts the error
# windows, reads the implicated source lines and either opens a GitHub issue
# with concrete remediation guidance and an optional Groq AI diagnosis, or
# comments on the issue already tracking that branch / pull request — one
# issue per line of work, never one per failing commit. A green run closes
# the matching open issues. Triggered after every push once its checks
# complete; the bot itself never fails a check.

on:
  workflow_run:
    workflows: ["CI", "Packaging", "Release"]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ci-bot-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    # Cancelled runs carry nothing to report; failure and success both do.
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the failing revision
        if: github.event.workflow_run.conclusion == 'failure'
        uses: actions/checkout@v7
        with:
          # Same-repo runs (push/PR/dispatch) always resolve; fork checkouts
          # are allowed to fail, in which case code snippets are skipped.
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
        continue-on-error: true
      - name: Bot self-test (pure functions, no network)
        run: python3 scripts/ci-bot-report.py --selftest
        continue-on-error: true
      - name: Analyse logs and open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BOT_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_BOT_REPO: ${{ github.repository }}
          CI_BOT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # Optional: add this repository/ Actions secret to enable French AI
          # summaries in bot issues. Without it the step is simply skipped.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/ci-bot-report.py
