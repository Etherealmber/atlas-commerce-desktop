# Native package descriptions for native-packages 0.10.0.
# Shared CLI: gem install native-packages --version 0.10.0
---
schema: 1
tool:
  version: 0.10.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the ALSA t64 package name. The GUI itself
# needs no audio stack; these are the winit/eframe runtime libraries only.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
  # The optional WebKitGTK helper (`atlas-commerce-webview`) links the engine,
  # so native-packages resolves every one of its runtime libraries. Declaring
  # them makes the DEB/RPM depend on the engine: an installed package always
  # has the integrated login. The portable archive and the AppImage keep it
  # optional and fall back to the system browser when it is absent.
  libwebkitgtk-6.0.so.4:
    deb: libwebkitgtk-6.0-4
    rpm: webkitgtk6.0
  libjavascriptcoregtk-6.0.so.4:
    deb: libjavascriptcoregtk-6.0-4
    rpm: javascriptcoregtk6.0
  libsoup-3.0.so.0:
    deb: libsoup-3.0-0
    rpm: libsoup3
  libgtk-4.so.1:
    deb: libgtk-4-1
    rpm: gtk4
  libgdk_pixbuf-2.0.so.0:
    deb: libgdk-pixbuf-2.0-0
    rpm: gdk-pixbuf2
  libpangocairo-1.0.so.0:
    deb: libpangocairo-1.0-0
    rpm: pango
  libpango-1.0.so.0:
    deb: libpango-1.0-0
    rpm: pango
  libharfbuzz.so.0:
    deb: libharfbuzz0b
    rpm: harfbuzz
  libcairo-gobject.so.2:
    deb: libcairo-gobject2
    rpm: cairo-gobject
  libcairo.so.2:
    deb: libcairo2
    rpm: cairo
  libgraphene-1.0.so.0:
    deb: libgraphene-1.0-0
    rpm: graphene
  libgio-2.0.so.0:
    deb: libglib2.0-0t64
    rpm: glib2
  libgobject-2.0.so.0:
    deb: libglib2.0-0t64
    rpm: glib2
  libglib-2.0.so.0:
    deb: libglib2.0-0t64
    rpm: glib2
  libgmodule-2.0.so.0:
    deb: libglib2.0-0t64
    rpm: glib2
  libatomic.so.1:
    deb: libatomic1
    rpm: libatomic
nfpm:
  name: atlas-commerce-desktop
  maintainer: loxdpsy/Etherealmber <noreply@etherealmber.dev>
  homepage: https://github.com/Etherealmber/atlas-commerce-desktop
  description: Client natif pour la plateforme Atlas Commerce
  license: MIT
  contents:
  # A glob source makes nFPM append its basename to the destination directory.
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/atlas-commerce-desktop"
    dst: "/usr/bin/"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/atlas-commerce-webview"
    dst: "/usr/bin/"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/atlas-commerce-desktop/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/atlas-commerce-desktop/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/applications/*.desktop"
    dst: "/usr/share/applications/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/icons/*.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/"
    file_info:
      mode: 420
  overrides:
    # ELF inspection cannot discover the GUI's dlopen dependencies. Keep
    # these aligned with the winit/eframe feature set and the runner images.
    deb:
      depends:
      - libdbus-1-3
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libgcc-s1
      - libstdc++6
      # The engine arrives through `libraries` above because the helper links
      # it. Kept here too so an explicit `--no-install-recommends` install of a
      # future split package still resolves the GTK runtime.
      recommends:
      - libgtk-4-1
    rpm:
      depends:
      - dbus-libs
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [bash, packaging/macos/dmg.sh, '@PAYLOAD@', '@PACKAGE@']
      output: 'atlas-commerce-desktop-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/atlas-commerce-desktop-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: atlas-commerce-desktop-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/atlas-commerce-desktop-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: atlas-commerce-desktop-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  # AppImages are built by the release's Linux jobs before publishing, so
  # checksums.txt lists them and its signature covers them. The update
  # information points at the newest stable release's .zsync for the same
  # architecture; pre-releases never carry an AppImage.
  appimage-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats: [appimage]
    appimage:
      update_information: gh-releases-zsync|Etherealmber|atlas-commerce-desktop|latest|atlas-commerce-desktop-*-x86_64.AppImage.zsync
    input:
      local: dist/atlas-commerce-desktop-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: atlas-commerce-desktop-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  appimage-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats: [appimage]
    appimage:
      update_information: gh-releases-zsync|Etherealmber|atlas-commerce-desktop|latest|atlas-commerce-desktop-*-aarch64.AppImage.zsync
    input:
      local: dist/atlas-commerce-desktop-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: atlas-commerce-desktop-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  # Windows has no native-packages target: the universal Inno Setup
  # installer (packaging/windows/atlas-commerce-desktop.iss) is assembled by
  # the windows-installer release job from both release binaries.
release:
  repository: Etherealmber/atlas-commerce-desktop
  prereleases: true
  checksums: checksums.txt
assets:
  AMD64:
    file: atlas-commerce-desktop-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/atlas-commerce-desktop-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: atlas-commerce-desktop-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/atlas-commerce-desktop-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: atlas-commerce-desktop-v@VERSION@-source.tar.gz
    local: dist/atlas-commerce-desktop-v@VERSION@-source.tar.gz
  MACOS:
    file: atlas-commerce-desktop-v@VERSION@-macos-universal.dmg
    local: dist/atlas-commerce-desktop-v@VERSION@-macos-universal.dmg
version_file: Cargo.toml
