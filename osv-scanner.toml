# Informational maintenance notice, not an exploit advisory. Chrono is used
# directly for local dates and auth expiry, and also occurs transitively. A
# migration must preserve timezone and RFC3339 expiry semantics; review this
# short-lived exception before expiry rather than masking security advisories.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-01-22
reason = """
Chrono is marked unmaintained; the advisory identifies no patched release or
specific vulnerability. Evaluate migration to a maintained date/time library,
including transitive dependencies and authentication expiry behavior.
"""
