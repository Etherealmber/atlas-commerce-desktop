# OSV-Scanner configuration for the Atlas Commerce desktop workspace.
#
# Every entry below is an `informational = "unmaintained"` RUSTSEC notice on a
# transitive dependency: none of them describe an exploitable vulnerability
# and no patched release exists. They are scoped per advisory ID so any new
# (security) advisory still fails the scan. Each exception carries a reason
# and an expiry one year out, after which the entry must be re-evaluated.
#
# The file sits next to Cargo.lock at the repository root, which is where
# osv-scanner's automatic configuration discovery looks for it.

[[IgnoredVulns]]
id = "RUSTSEC-2020-0054" # directories 6.0.0
ignoreUntil = 2027-10-23
reason = """
Transitive dependency pulled in by the pinned fastframe v0.14.0 crates
(fastframe-dirs, fastframe-fonts, fastframe-instance, fastframe-notifications,
fastframe-theme, fastframe-titlebar). Unmaintained notice with no patched
release; the advisory itself was withdrawn upstream on 2021-04-19. Re-evaluate
when fastframe migrates to directories-next.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2025-0007" # ring 0.17.14
ignoreUntil = 2027-10-23
reason = """
Transitive TLS crypto provider reached through rustls/reqwest
(fastframe-update, quinn-proto). Unmaintained notice, withdrawn upstream on
2025-02-22, with no patched release. Tracked for migration to the rustls
aws-lc-rs crypto provider.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2022-0048" # xml-rs 0.8.29
ignoreUntil = 2027-10-23
reason = """
Transitive dependency of gl_generator, a legacy OpenGL binding generator in
the eframe/glow graphics stack. Unmaintained notice, withdrawn upstream on
2023-05-04; build-time only, never reached at runtime.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370" # zvariant 5.15.1
ignoreUntil = 2027-10-23
reason = """
Linux-only transitive dependency via zbus/atspi (eframe accessibility and the
ksni system-tray integration). Upstream unmaintained notice published
2026-10-16 with no patched release; Windows and macOS builds do not include
this crate.
"""

