[package]
name = "atlas-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui + fastframe interface for Atlas Commerce Desktop."

[dependencies]
atlas-core.workspace = true
atlas-api.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64 = "0.22"
getrandom = "0.3"
scraper = { version = "0.25", default-features = false }
log.workspace = true
chrono.workspace = true
qrcode.workspace = true
open.workspace = true
reqwest.workspace = true
tokio.workspace = true
url.workspace = true

egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
# egui_extras does not enable raster decoders by itself. Profile pictures
# from the same-origin avatar proxy need these formats at runtime.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

fastframe-fonts.workspace = true
fastframe-text.workspace = true
fastframe-icons.workspace = true
fastframe-theme.workspace = true
fastframe-i18n.workspace = true
fastframe-titlebar.workspace = true
fastframe-tray.workspace = true
fastframe-shell.workspace = true
fastframe-notifications.workspace = true
fastframe-scroll.workspace = true
fastframe-power.workspace = true
fastframe-autostart.workspace = true
fastframe-update.workspace = true
fastframe-file.workspace = true

[build-dependencies]
fastframe-i18n = { workspace = true, features = ["build"] }

# Windows uses the installed WebView2 runtime, never a bundled browser.
[target.'cfg(windows)'.dependencies]
wry = { version = "=0.56.1", default-features = false }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "=0.11.5", default-features = false }
webkit6 = "=0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
atlas-webview-macos = { path = "../webview-macos" }
